# VPS 建站教程站 · VMRack 服务器 (209.146.116.8) 的 nginx 配置
# 用法（服务器上）：
#   git clone https://github.com/ytlq72803-ai/vps-tutorials.git /var/www/vps-tutorials
#   cp /var/www/vps-tutorials/deploy/nginx-vps-tutorials.conf /etc/nginx/sites-available/vps-tutorials
#   ln -s /etc/nginx/sites-available/vps-tutorials /etc/nginx/sites-enabled/vps-tutorials
#   nginx -t && systemctl reload nginx
# 更新网站：cd /var/www/vps-tutorials && git pull（静态文件，无需重启）
# 注意：443 端口已被 xray 占用，所以本站用 8080 端口出站，由 Cloudflare 代理（橙色云）对外提供 HTTPS。
server {
    listen 8080;
    server_name vps.sdyt777.de5.net;
    root /var/www/vps-tutorials/public;
    index index.html;

    access_log /var/log/nginx/vps-tutorials.access.log;
    error_log /var/log/nginx/vps-tutorials.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
